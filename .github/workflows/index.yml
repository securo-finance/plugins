name: Index

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python build_index.py local examples/streaming --out /tmp/site

  # Builds the index and commits it to the `index` branch, which the host
  # serves as static files. A run that changes nothing commits nothing.
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check out the published index
        run: |
          if git fetch --depth 1 origin index; then
            git worktree add -B index site FETCH_HEAD
          else
            git worktree add --orphan -b index site
          fi
      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp site/v1/state.json "$RUNNER_TEMP/state.json" 2>/dev/null || true
          rm -rf site/v1
          python build_index.py github --out site --state "$RUNNER_TEMP/state.json"
          cp vercel.json site/vercel.json
      - name: Publish
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The index didn't change."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update the index"
          git push origin index
